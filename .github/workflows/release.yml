name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag (minus the leading "v") must match the version in pyproject.toml
# AND arme2cosmos/__init__.py, or the build job fails before anything ships.
#
# Publishing to PyPI uses Trusted Publishing (OIDC) -- no API token/secret.
# One-time PyPI setup (https://pypi.org/manage/account/publishing/):
#   PyPI project : arme2cosmos     (use a "pending" publisher if it doesn't exist yet)
#   Owner        : artemis-sbs
#   Repository   : arme2cosmos
#   Workflow     : release.yml
#   Environment  : pypi            (matches `environment: pypi` in the pypi job below)

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('arme2cosmos/__init__.py').read()).group(1))")
          echo "tag=$tag  pyproject=$proj  __init__=$init"
          if [ "$tag" != "$proj" ] || [ "$tag" != "$init" ]; then
            echo "::error::Tag v$tag does not match pyproject ($proj) / __init__ ($init). Bump both and re-tag."
            exit 1
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub Release
    steps:
      - uses: actions/checkout@v4
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --title "$GITHUB_REF_NAME"
          --generate-notes
