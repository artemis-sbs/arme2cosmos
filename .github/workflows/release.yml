name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag (minus the leading "v") must match the version in pyproject.toml
# AND arme2cosmos/__init__.py, or the job fails before building.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # needed to create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          proj=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          init=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('arme2cosmos/__init__.py').read()).group(1))")
          echo "tag=$tag  pyproject=$proj  __init__=$init"
          if [ "$tag" != "$proj" ] || [ "$tag" != "$init" ]; then
            echo "::error::Tag v$tag does not match pyproject ($proj) / __init__ ($init). Bump both and re-tag."
            exit 1
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          dist/*
          --title "$GITHUB_REF_NAME"
          --generate-notes
